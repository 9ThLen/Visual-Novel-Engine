[package]
# Not the product name, and not the player's crate either. The two shells build
# in two directories and are two applications; sharing a crate name would make
# `cargo` artifacts from one look reusable to the other.
name = "vne-desktop-studio"
# Overwritten by staging with the engine version. Tauri bundles the version from
# tauri.conf.json; a Cargo manifest that disagrees is a second answer to the
# same question.
version = "0.0.0"
description = "Visual Novel Engine studio"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# For the report the bridge commands hand back to the window. Nothing else is
# serialised here, and no plugin is pulled in: the bridge is spawned with
# `std::process::Command`, so there is no `tauri-plugin-shell` and no
# `shell:allow-execute` — a permission to run programs would be general, and
# what is needed is one specific process.
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
