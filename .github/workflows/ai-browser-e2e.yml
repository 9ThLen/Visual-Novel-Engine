name: AI browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-browser-e2e:
    runs-on: ubuntu-latest
    # A cold Metro build plus dev-bundle boot on a two-core runner makes each
    # navigation several times slower than locally; 20 minutes was cutting it close.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Lint with zero warnings
        run: pnpm lint
      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ai-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
