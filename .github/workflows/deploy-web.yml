name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Check editor boundaries
        run: pnpm check:editor-boundaries

      - name: Check reader audio boundaries
        run: pnpm check:reader-audio-boundaries

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pnpm test:ai-e2e

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up before setup-node so that `cache: pnpm` can find it.
      # The version has to match packageManager in package.json: pnpm 9 reads
      # pnpm-workspace.yaml (which carries settings only, no `packages:`) as a
      # workspace definition and aborts with "packages field missing or empty".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          VNE_WEB_BASE_URL: /${{ github.event.repository.name }}

      - name: Strict demo story export
        run: pnpm export:story --story assets/demo-story.json --out .ci-story-export --skip-build --strict

      - name: Strict advanced demo story export
        run: pnpm export:story --story assets/demo-story-advanced.json --out .ci-advanced-story-export --skip-build --strict

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install smoke-test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install smoke-test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify deployed web app
        run: node scripts/check-deployed-web.mjs "${{ steps.deployment.outputs.page_url }}"
